<div class="container-fluid">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="mb-1">
                Users
            </h2>

            <p class="text-muted mb-0">
                Manage registered customers
            </p>

        </div>

    </div>


    <!-- Search Card -->
    <div class="card mb-4">

        <div class="card-body">

            <div class="row g-2">

                <!-- Search Input -->
                <div class="col-md-8">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Search users by name..."
                        [(ngModel)]="searchKeyword"
                        (keyup.enter)="search()"
                    >

                </div>


                <!-- Search Button -->
                <div class="col-md-2">

                    <button
                        type="button"
                        class="btn btn-dark w-100"
                        (click)="search()"
                    >

                        Search

                    </button>

                </div>


                <!-- Clear Button -->
                <div class="col-md-2">

                    <button
                        type="button"
                        class="btn btn-outline-dark w-100"
                        (click)="clearSearch()"
                    >

                        Clear

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Users Table -->
    <div class="card">

        <!-- Card Header -->
        <div class="card-header">

            <h5 class="mb-0">
                Customers
            </h5>

        </div>


        <!-- Card Body -->
        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <!-- Table Header -->
                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Created At
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <!-- Table Body -->
                    <tbody>

                        @for (
                            user of users();
                            track user.id
                        ) {

                            <tr>

                                <!-- Name -->
                                <td>

                                    {{ user.name }}

                                </td>


                                <!-- Email -->
                                <td>

                                    {{ user.email }}

                                </td>


                                <!-- Phone -->
                                <td>

                                    {{ user.phone }}

                                </td>


                                <!-- Role -->
                                <td>

                                    <span class="badge bg-dark">

                                        {{ user.role }}

                                    </span>

                                </td>


                                <!-- Created At -->
                                <td>

                                    {{ user.createdAt }}

                                </td>


                                <!-- Actions -->
                                <td>

                                    <button
                                        type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        (click)="deleteUser(user)"
                                    >

                                        Delete

                                    </button>

                                </td>

                            </tr>

                        }


                        <!-- Empty State -->
                        @if (users().length === 0) {

                            <tr>

                                <td
                                    colspan="6"
                                    class="text-center py-4 text-muted"
                                >

                                    No customers found.

                                </td>

                            </tr>

                        }

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
